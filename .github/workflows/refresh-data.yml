name: Refresh rosters, schedule, and injuries

# Weekly: pull current rosters, this season's player stats, the schedule, and
# the injury report from ESPN and commit them, so the hosted demo picks up
# trades, signings, rookies, breakout players, NBA Cup games, time changes,
# and injury adjustments without anyone running the fetch scripts by hand.
on:
  schedule:
    - cron: '0 10 * * 1'  # Mondays 10:00 UTC (6 AM Eastern)
  workflow_dispatch:       # "Run workflow" button for an immediate refresh

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Fetch rosters and stats from ESPN
        run: python scripts/fetch_rosters.py | tee fetch.log

      - name: Fetch schedule from ESPN
        run: python scripts/fetch_schedule.py | tee -a fetch.log

      - name: Fetch injuries from ESPN
        run: python scripts/fetch_injuries.py | tee -a fetch.log

      - name: Fail if a fetch didn't go through
        # The fetch scripts print an error and save nothing when ESPN is
        # unreachable. An empty injury report (off-season) is fine.
        run: |
          grep -q "rostered players" fetch.log
          grep -q "games to data/input/nba_schedule_" fetch.log
          if grep -q "Error fetching injuries" fetch.log; then exit 1; fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fetch scripts only write the rosters, schedule, injuries, and (once
          # the season is under way) stats files, so adding the folder picks up just those
          git add data/input
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh rosters, player stats, schedule, and injuries from ESPN"
            git push
          fi
